<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합사회 AI 맞춤형 수준별 진단 & AI 튜터</title>
    
    <!-- PWA Manifest 연결 (?page=manifest 경로 호출) -->
    <link rel="manifest" href="?page=manifest">
    <meta name="theme-color" content="#4f46e5">
    
    <!-- Tailwind CSS & Chart.js CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- 헤더 -->
    <header class="bg-indigo-600 text-white py-6 px-4 shadow-md">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">고1 통합사회 AI 수준별 진단 & 튜터</h1>
                <p class="text-indigo-200 text-sm mt-1">Google Apps Script 기반 맞춤형 학습 시스템</p>
            </div>
            <!-- API Key 입력 영역 -->
            <div class="flex items-center gap-2 bg-indigo-700 p-2 rounded-lg text-sm w-full md:w-auto">
                <span class="whitespace-nowrap font-medium">Gemini API Key:</span>
                <input type="password" id="apiKeyInput" placeholder="API Key를 입력하세요" 
                       class="px-2 py-1 rounded bg-white text-slate-800 focus:outline-none text-sm w-full md:w-48">
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-8">

        <!-- 탭 네비게이션 -->
        <div class="flex border-b border-slate-200 gap-4 text-base font-semibold">
            <button id="tabNavDiag" onclick="switchTab('diagnostic')" class="py-2 px-4 border-b-2 border-indigo-600 text-indigo-600">1. 진단 평가 & AI 튜터</button>
            <button id="tabNavDash" onclick="switchTab('dashboard')" class="py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-indigo-600">2. 학습 분석 대시보드</button>
        </div>

        <!-- 탭 1: 진단 평가 & AI 튜터 섹션 -->
        <section id="sectionDiagnostic" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold text-slate-900 mb-4 pb-2 border-b">📝 1학년 통합사회 개념 진단 평가</h2>
                <form id="diagnosticForm" class="space-y-6">
                    <div class="space-y-2">
                        <label class="font-semibold block text-slate-900">
                            Q1. [자산 관리와 금융] 자산 관리의 3대 요소인 안전성, 수익성, 유동성에 대한 설명 중 올바른 설명과 이유를 서술하거나 고르세요.
                        </label>
                        <textarea id="q1Ans" rows="2" class="w-full p-3 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                  placeholder="예: 예금은 안전성과 유동성이 높지만 수익성은 낮다."></textarea>
                    </div>

                    <div class="space-y-2">
                        <label class="font-semibold block text-slate-900">
                            Q2. [인권 보장과 헌법] 기본권 제한의 한계에 대하여 '국가안전보장·질서유지 또는 공공복리를 위하여 필요한 경우에 한하여 법률로써 제한할 수 있으나, ( ? )의 본질적인 내용을 침해할 수 없다'에서 빈칸에 들어갈 알맞은 말은?
                        </label>
                        <input type="text" id="q2Ans" class="w-full p-3 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                               placeholder="정답을 작성해주세요 (예: 자유와 권리)">
                    </div>

                    <div class="space-y-2">
                        <label class="font-semibold block text-slate-900">
                            Q3. [자본주의와 경제] 시장 실패의 원인 중 하나인 '외부 효과(외부 불경제 등)'에 대해 아는 대로 간단히 설명하세요.
                        </label>
                        <textarea id="q3Ans" rows="2" class="w-full p-3 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                  placeholder="답안을 자유롭게 작성해 주세요."></textarea>
                    </div>

                    <button type="button" onclick="analyzeAnswers()" id="btnAnalyze"
                            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-colors">
                        답안 제출 및 AI 분석 시작하기
                    </button>
                </form>
            </div>

            <!-- AI 진단 결과 및 튜터 대화창 -->
            <div id="tutorResultArea" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-6">
                <div class="p-4 rounded-lg bg-indigo-50 border border-indigo-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span class="text-sm font-bold text-indigo-600 uppercase tracking-wider">AI 진단 결과</span>
                        <h3 class="text-2xl font-bold mt-1" id="levelResultTitle">분석 중...</h3>
                        <p class="text-slate-600 text-sm mt-1" id="levelResultDesc"></p>
                    </div>
                    <span id="levelBadge" class="px-4 py-2 rounded-full font-bold text-white bg-indigo-600">진단 진행 중</span>
                </div>

                <div class="border rounded-xl p-4 bg-slate-50 space-y-4">
                    <h4 class="font-bold text-slate-800 flex items-center gap-2">
                        🤖 AI 맞춤형 1:1 튜터링 대화방
                    </h4>
                    
                    <div id="chatHistory" class="h-64 overflow-y-auto space-y-3 bg-white p-4 rounded-lg border border-slate-200"></div>

                    <div class="flex gap-2">
                        <input type="text" id="chatInput" placeholder="이해가 안 가는 개념이나 궁금한 점을 질문해 보세요..." 
                               onkeydown="if(event.key === 'Enter') sendChatMessage()"
                               class="flex-1 p-3 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <button onclick="sendChatMessage()" id="btnSendChat" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-lg font-bold">
                            전송
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 탭 2: 학습 분석 대시보드 섹션 -->
        <section id="sectionDashboard" class="hidden space-y-6">
            <h2 class="text-xl font-bold text-slate-900">📊 개인별 학습 분석 대시보드</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-semibold text-slate-500">종합 정답률</p>
                    <p class="text-3xl font-extrabold text-indigo-600 mt-2">78%</p>
                    <p class="text-xs text-emerald-600 mt-1">↑ 지난주 대비 +5% 상승</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-semibold text-slate-500">현재 학습 수준</p>
                    <p class="text-3xl font-extrabold text-slate-800 mt-2" id="dashCurrentLevel">진단 대기</p>
                    <p class="text-xs text-slate-500 mt-1">최근 진단 기준</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <p class="text-sm font-semibold text-slate-500">주요 취약 단원</p>
                    <p class="text-3xl font-extrabold text-rose-500 mt-2">자본주의와 경제</p>
                    <p class="text-xs text-rose-500 mt-1">오개념 집중 교정 필요</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4">📈 성취도 변화 추이</h3>
                    <div class="h-64">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 mb-4">🎯 단원별 취약 개념 분포</h3>
                    <div class="h-64 flex justify-center">
                        <canvas id="weaknessChart"></canvas>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // PWA Service Worker 등록 (?page=sw 경로 등록)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('?page=sw')
                    .then(reg => console.log('Service Worker 등록 성공:', reg.scope))
                    .catch(err => console.log('Service Worker 등록 실패:', err));
            });
        }

        function switchTab(tab) {
            const diagSec = document.getElementById('sectionDiagnostic');
            const dashSec = document.getElementById('sectionDashboard');
            const tabDiag = document.getElementById('tabNavDiag');
            const tabDash = document.getElementById('tabNavDash');

            if (tab === 'diagnostic') {
                diagSec.classList.remove('hidden');
                dashSec.classList.add('hidden');
                tabDiag.className = "py-2 px-4 border-b-2 border-indigo-600 text-indigo-600";
                tabDash.className = "py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-indigo-600";
            } else {
                diagSec.classList.add('hidden');
                dashSec.classList.remove('hidden');
                tabDash.className = "py-2 px-4 border-b-2 border-indigo-600 text-indigo-600";
                tabDiag.className = "py-2 px-4 border-b-2 border-transparent text-slate-500 hover:text-indigo-600";
                renderCharts();
            }
        }

        function runServerScript(prompt) {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert("상단 헤더에 Gemini API Key를 입력해주세요!");
                return Promise.reject("API Key 없음");
            }

            return new Promise((resolve, reject) => {
                google.script.run
                    .withSuccessHandler(response => resolve(response))
                    .withFailureHandler(error => reject(error))
                    .callGeminiAPI(prompt, apiKey);
            });
        }

        async function analyzeAnswers() {
            const q1 = document.getElementById('q1Ans').value;
            const q2 = document.getElementById('q2Ans').value;
            const q3 = document.getElementById('q3Ans').value;

            if (!q1 || !q2 || !q3) {
                alert("모든 진단 문제에 답안을 입력해주세요!");
                return;
            }

            const btn = document.getElementById('btnAnalyze');
            btn.disabled = true;
            btn.innerText = "AI가 답안을 분석 중입니다...";

            const resultArea = document.getElementById('tutorResultArea');
            resultArea.classList.remove('hidden');
            document.getElementById('levelResultTitle').innerText = "AI 분석 진행 중...";
            document.getElementById('levelResultDesc').innerText = "답안의 오류 및 오개념 여부를 판정하고 있습니다.";

            const prompt = `
넌 고등학교 1학년 통합사회 전문 교육 AI 튜터야.
학생이 제출한 다음 3가지 진단 문제 답안을 분석해줘:

Q1(자산관리): ${q1}
Q2(기본권제한): ${q2}
Q3(외부효과): ${q3}

다음 규칙에 맞춰 응답해줘:
1. 첫 번째 줄에 학생의 전체적인 수준을 [기초], [심화], [오개념] 셋 중 하나만 반드시 포맷에 맞게 작성할 것. (예: [판정: 기초] 또는 [판정: 심화] 또는 [판정: 오개념])
2. 그 다음 줄부터 학생의 이해 수준 분석 결과와 오개념 교정 포인트를 친절하고 다정하게 설명할 것.
3. 마지막에는 판정 수준에 맞춘 첫 번째 맞춤형 학습 팁과 질문을 건넬 것.
`;

            try {
                const aiResponse = await runServerScript(prompt);
                
                let level = "기초";
                let badgeBg = "bg-amber-500";
                
                if (aiResponse.includes("[판정: 심화]")) {
                    level = "심화";
                    badgeBg = "bg-emerald-600";
                } else if (aiResponse.includes("[판정: 오개념]")) {
                    level = "오개념";
                    badgeBg = "bg-rose-600";
                }

                document.getElementById('levelResultTitle').innerText = `${level} 학습자 유형`;
                document.getElementById('levelResultDesc').innerText = "AI 튜터가 맞춤형 코칭을 제공합니다.";
                
                const badge = document.getElementById('levelBadge');
                badge.className = `px-4 py-2 rounded-full font-bold text-white ${badgeBg}`;
                badge.innerText = `${level} 유형`;

                document.getElementById('dashCurrentLevel').innerText = `${level} 단계`;

                const chatHistory = document.getElementById('chatHistory');
                chatHistory.innerHTML = `
                    <div class="bg-indigo-50 p-3 rounded-lg text-slate-800 text-sm leading-relaxed border border-indigo-100">
                        <span class="font-bold text-indigo-600 block mb-1">🤖 AI 튜터</span>
                        ${aiResponse.replace(/\[판정: (기초|심화|오개념)\]/g, '').replace(/\n/g, '<br>')}
                    </div>
                `;
            } catch (err) {
                alert("오류 발생: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "답안 제출 및 AI 분석 시작하기";
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            const btn = document.getElementById('btnSendChat');
            btn.disabled = true;

            const chatHistory = document.getElementById('chatHistory');

            chatHistory.innerHTML += `
                <div class="bg-slate-100 p-3 rounded-lg text-slate-800 text-sm text-right ml-12">
                    <span class="font-bold text-slate-600 block mb-1">나</span>
                    ${message}
                </div>
            `;

            input.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const prompt = `
너는 고등학교 1학년 통합사회 AI 튜터야. 
학생의 질문: "${message}"

친절하고 명확하게 통합사회 개념을 설명해주고, 필요하면 쉬운 예시를 들어줘.
`;

            try {
                const response = await runServerScript(prompt);
                chatHistory.innerHTML += `
                    <div class="bg-indigo-50 p-3 rounded-lg text-slate-800 text-sm leading-relaxed border border-indigo-100">
                        <span class="font-bold text-indigo-600 block mb-1">🤖 AI 튜터</span>
                        ${response.replace(/\n/g, '<br>')}
                    </div>
                `;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            } catch (err) {
                alert("답변을 가져오지 못했습니다: " + err.message);
            } finally {
                btn.disabled = false;
            }
        }

        let trendChartInstance = null;
        let weaknessChartInstance = null;

        function renderCharts() {
            if (trendChartInstance) trendChartInstance.destroy();
            if (weaknessChartInstance) weaknessChartInstance.destroy();

            const ctx1 = document.getElementById('trendChart').getContext('2d');
            trendChartInstance = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ['1주차', '2주차', '3주차', '4주차', '현재'],
                    datasets: [{
                        label: '성취도 점수',
                        data: [60, 68, 72, 70, 78],
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctx2 = document.getElementById('weaknessChart').getContext('2d');
            weaknessChartInstance = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['자산 관리와 금융', '인권 보장과 헌법', '자본주의와 경제', '정의와 사회 불평등'],
                    datasets: [{
                        data: [15, 20, 45, 20],
                        backgroundColor: ['#6366f1', '#10b981', '#f43f5e', '#f59e0b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
